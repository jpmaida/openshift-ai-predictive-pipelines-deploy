kind: Deployment
apiVersion: apps/v1
metadata:
  name: aistor
  namespace: aistor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aistor
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: aistor
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aistor-data
        - name: license
          secret:
            secretName: minio-license
            items:
              - key: minio.license
                path: minio.license
            defaultMode: 420
      containers:
        - resources: {}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 6
          terminationMessagePath: /dev/termination-log
          name: aistor
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 5
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: data
              mountPath: /mnt/data
            - name: license
              readOnly: true
              mountPath: /minio.license
              subPath: minio.license
          terminationMessagePolicy: File
          envFrom:
            - secretRef:
                name: minio-credentials
          image: 'quay.io/minio/aistor/minio:latest'
          args:
            - server
            - /mnt/data
            - '--license'
            - /minio.license
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600