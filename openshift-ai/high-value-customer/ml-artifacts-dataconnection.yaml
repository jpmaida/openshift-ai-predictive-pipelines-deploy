kind: Secret
apiVersion: v1
metadata:
  name: ml-artifacts
  namespace: high-value-customer-ml
  labels:
    opendatahub.io/dashboard: 'true'
    opendatahub.io/managed: 'true'
  annotations:
    opendatahub.io/connection-type: s3
